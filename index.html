nav{display:flex;gap:4px;padding:0 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{border:0;background:none;padding:12px 16px;font:inherit;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:var(--p);border-color:var(--p)}
main{max-width:1060px;margin:0 auto;padding:20px 24px 60px}
.banner{background:var(--warnb);border:1px solid #f0d9a8;color:#6b4300;border-radius:8px;padding:9px 13px;font-size:13px;margin-bottom:16px}
h2{font-size:18px;margin:26px 0 4px}h3{font-size:15px;margin:0}.sub{color:var(--mut);font-size:13px;margin:0 0 10px}
select,input[type=text],textarea{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:10px 0}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--grey);color:#444;margin-right:6px}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.warn{background:var(--warnb);color:var(--warn)}.pill.bad{background:var(--badb);color:var(--bad)}.pill.p{background:var(--pl);color:var(--p)}
.ev{margin:8px 0 0;padding:8px 10px;background:#f7f5fa;border-left:3px solid var(--p2);border-radius:4px;font-size:13.5px}
.ev small{color:var(--mut)}.cav{color:var(--warn);font-size:12px}
.fb{display:flex;gap:6px;margin-top:10px;align-items:center;flex-wrap:wrap}
.fb button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.fb button.sel.yes{background:var(--okb);border-color:var(--ok);color:var(--ok)}.fb button.sel.partly{background:var(--warnb);border-color:var(--warn);color:var(--warn)}.fb button.sel.no{background:var(--badb);border-color:var(--bad);color:var(--bad)}
.fb input{flex:1;min-width:160px;font-size:13px}
.bar{height:8px;background:var(--grey);border-radius:99px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--p2)}
details summary{cursor:pointer;color:var(--p);font-size:13px;margin-top:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:#fff}
.chip b{display:block;font-size:11.5px;color:var(--mut);font-weight:600}
.btn{background:var(--p);color:#fff;border:0;border-radius:6px;padding:7px 14px;font:inherit;font-weight:600;cursor:pointer}.btn.ghost{background:#fff;color:var(--p);border:1px solid var(--p)}
.grid{display:grid;grid-template-columns:260px 1fr;gap:20px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
.opts label{display:block;font-size:13.5px;margin:3px 0}.opts .g{font-weight:700;font-size:12px;color:var(--mut);margin:10px 0 2px;text-transform:uppercase;letter-spacing:.04em}
.band h2{display:flex;align-items:center;gap:8px}.cnt{background:var(--pl);color:var(--p);border-radius:99px;font-size:12px;padding:1px 9px}
.cand{cursor:pointer}.cand:hover{border-color:var(--p2)}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left}
.todo{font-size:13px;background:var(--pl);border-radius:6px;padding:8px 10px;margin-top:8px}
</style></head><body>

  if(r.tier==='context_only')return `Your logbooks put you around this work (${r.nc} entries) but none shows you doing it yourself.`;
  return '';
}
function authLine(r){const a=r.au,n=schemeFor(r.r);
  switch(a.s){case 'held_current':return `Authority record: ${a.sc} complete and current${a.exp?` (to ${a.exp})`:''}.`;
   case 'held_expiring':return `Authority record: ${a.sc} complete, expires ${a.exp} – renewal needed now.`;
   case 'held_expired':return `Authority record: ${a.sc} was completed but lapsed${a.exp?` in ${a.exp}`:''}.`;
   case 'partial':return `Authority record: ${a.sc} part-complete – ${a.miss.length} module${a.miss.length>1?'s':''} still to finish.`;
   case 'no_record':return `No ${a.sc||REQ[r.r].sc} record found. If you hold an Authority-internal authorisation, it isn't in this data.`;
   default:return '';}}
const schemeFor=id=>REQ[id].sc;
const gateReq=id=>REQ[id].gate;
function tierPill(t){return {evidenced:'<span class="pill ok">Evidenced</span>',some_evidence:'<span class="pill p">Some evidence</span>',routine_only:'<span class="pill">Routine only</span>',context_only:'<span class="pill warn">Around it, not doing it</span>'}[t]||''}
function exHtml(r,all){const L=[...r.ex];const c=r.cx||[];let h=L.map(e=>`<div class="ev">“${esc(e.t)}”<br><small>${esc(e.d)} · ${esc(e.s)}</small>${e.c?` <span class="cav">· ${esc(e.c)}</span>`:''}</div>`).join('');
  if(all&&c.length)h+=`<div class="sub" style="margin-top:8px">Also in the logbook (not counted as doing it):</div>`+c.map(e=>`<div class="ev" style="border-color:#ccc">“${esc(e.t)}”<br><small>${esc(e.d)}</small>${e.c?` <span class="cav">· ${esc(e.c)}</span>`:''}</div>`).join('');return h}
function fbHtml(id,tier,kind,q){const f=FB[id]||{};const b=(v,l)=>`<button class="${v}${f.v===v?' sel':''}" onclick="setFB('${id}','${tier}','${kind}','${v}')">${l}</button>`;
  return `<div class="fb"><span class="sub" style="margin:0">${q}</span>${b('yes','Yes, that’s right')}${b('partly','Partly')}${b('no','No')}${f.v&&f.v!=='yes'?`<input type="text" placeholder="What’s wrong or missing?" value="${esc(f.note||'')}" onchange="setNote('${id}',this.value)">`:''}</div>`}

/* ---------- KEEPER VIEW ---------- */
function keeperView(){
  const k=DATA.keepers.find(x=>x.id===S.keeper);
  const recs=k.recs.filter(r=>['evidenced','some_evidence','routine_only','context_only'].includes(r.tier));
  const order={evidenced:0,some_evidence:1,routine_only:2,context_only:3};recs.sort((a,b)=>order[a.tier]-order[b.tier]||b.ns-a.ns);
  const doing=recs.filter(r=>r.tier!=='context_only');
  let h=`<div class="row"><label>Viewing as <select onchange="S.keeper=this.value;render()">${DATA.keepers.map(x=>`<option value="${x.id}" ${x.id===S.keeper?'selected':''}>${esc(x.name)} – ${esc(x.grade)}</option>`).join('')}</select></label></div>
  <p class="sub" style="margin-top:10px">This is what your station logs and the Authority’s training records suggest. It is an inference, not an assessment. Please tell us where it’s wrong – that’s the point of this page.</p>`;
  h+=`<h2>What your logbooks show you’ve done</h2><p class="sub">${doing.length} areas. Sorted by strength of evidence.</p>`;
  h+=doing.map(r=>{const id=k.id+'|work|'+r.r;return `<div class="card"><div class="row"><h3>${esc(REQ[r.r].label)}</h3>${tierPill(r.tier)}</div>
   <p style="margin:6px 0 0">${workLine(r)}</p>${r.cav.length?`<p class="cav" style="margin:2px 0">Note: ${esc(r.cav.join('; '))}</p>`:''}
   <details><summary>Show the entries</summary>${exHtml(r,true)}</details>${fbHtml(id,r.tier,'work','Is this right?')}</div>`}).join('')||'<p>No clear evidence found.</p>';
  const ctx=recs.filter(r=>r.tier==='context_only');
  if(ctx.length){h+=`<h2>Work you were around, but the logs don’t show you doing</h2><p class="sub">We don’t count these as skills. Tell us if we’re wrong – maybe you did the work and it wasn’t written down.</p>`;
   h+=ctx.map(r=>{const id=k.id+'|ctx|'+r.r;return `<div class="card"><div class="row"><h3>${esc(REQ[r.r].label)}</h3>${tierPill(r.tier)}</div><p style="margin:6px 0 0">${workLine(r)}</p>
   <details><summary>Show the entries</summary>${exHtml({ex:[],cx:r.cx},true)}</details>${fbHtml(id,r.tier,'context','Is that a fair reading: around this work, but not doing it yourself?')}</div>`}).join('')}
  /* qualifications */
  const sch=[...k.schemes].sort((a,b)=>(a.total-a.held)-(b.total-b.held));
  h+=`<h2>Your qualifications on the Authority’s record</h2><p class="sub">A scheme is a bundle of modules; you hold the qualification only when every module is complete.</p>`;
  h+=sch.map(s=>{const left=s.total-s.held;const done=s.band==='certified_current';const id=k.id+'|route|'+s.sc;
   const sup=[...new Set(s.sup)].map(x=>REQ[x].label);
   return `<div class="card"><div class="row"><h3>${esc(SCHEME[s.sc]||s.sc)} <span style="color:var(--mut);font-weight:400">(${s.sc})</span></h3>
    ${done?`<span class="pill ok">Complete & current${s.exp?' to '+s.exp:''}</span>`:s.band==='lapsed_renew'?'<span class="pill warn">Lapsed – renew</span>':`<span class="pill p">${s.held} of ${s.total} modules</span>`}</div>
    <div class="bar"><i style="width:${100*s.held/s.total}%"></i></div>
    ${left&&!done&&s.band!=='lapsed_renew'?`<div class="sub" style="margin:0">Still to complete: ${s.miss.map(m=>`${esc(DATA.mods[m.m])} <span class="pill">${m.st==='never_attempted'?'not started':m.st==='attended_not_completed'?'attended, not finished':'tried before'}</span>`).join(' ')}</div>`:''}
    ${sup.length&&left?`<div class="todo">Your recent logbook work in <b>${sup.map(esc).join(', ')}</b> relates to what’s missing here.</div>`:''}
    ${left&&!done&&left<=2?fbHtml(id,left===1?'one_module':'two_modules','route','Is finishing this a sensible next step for you?'):''}</div>`}).join('');
  return h}
/* ---------- EMPLOYER VIEW ---------- */
const HELD=['held_current','held_expiring'];
function assess(k,musts){
  const per=musts.map(id=>{const r=k.recs.find(x=>x.r===id);const g=gateReq(id);
    let ev='none';if(r){if(['evidenced','some_evidence'].includes(r.tier))ev=r.stale?'dated':'recent';else if(r.tier==='context_only')ev='context';else if(r.tier==='routine_only')ev='routine'}
    let tk=g?(r?r.au.s:'no_record'):'na';
    return {id,r,ev,tk,g}});
  const ungated=per.filter(p=>!p.g),gated=per.filter(p=>p.g);
  const unmet=ungated.filter(p=>p.ev!=='recent').length;
  const gaps=gated.filter(p=>!HELD.includes(p.tk));
  const gapsNoEv=gaps.filter(p=>p.ev!=='recent').length;
  const small=gaps.every(p=>p.tk==='held_expired'||(p.tk==='partial'&&p.r.au.miss.length<=2));
  const supported=per.filter(p=>p.ev==='recent'||(p.g&&HELD.includes(p.tk))).length;
  let band;
  if(unmet===0&&gaps.length===0)band=0;else if(unmet===0&&gaps.length<=2&&small&&gapsNoEv===0)band=1;else if(unmet===0)band=2;else if(supported>=Math.ceil(musts.length/2))band=3;else band=4;
  const nEv=per.filter(p=>p.ev==='recent').length;
  return {k,per,band,gaps:gaps.length,nEv,tot:per.reduce((a,p)=>a+(p.r?p.r.ns:0),0)}}
const BANDS=[['Ready on record','Every ticket-gated requirement is current on the Authority’s record, and every other requirement has recent hands-on evidence.'],['Close – tickets to finish','Experience is evidenced everywhere; one or two tickets need a small number of modules or a renewal.'],['Experience is there, longer route','Non-ticket requirements are evidenced, but ticket gaps are larger, or there is no logbook experience behind a missing ticket.'],['Partial match','At least half the requirements are supported by recent hands-on evidence or a current ticket.']];
function chip(p){const L=REQ[p.id].label;let e={recent:['Evidence','ok'],dated:['Dated','warn'],context:['Around it only','warn'],routine:['Routine only',''],none:['No evidence','bad']}[p.ev];if(p.g&&HELD.includes(p.tk)&&p.ev!=='recent'&&p.ev!=='dated')e=['No logbook evidence',''];
  let t='';if(p.g){t={held_current:['Ticket current','ok'],held_expiring:['Ticket expires '+(p.r&&p.r.au.exp),'warn'],held_expired:['Ticket lapsed','warn'],partial:[`Ticket ${p.r&&p.r.au.miss.length} module${p.r&&p.r.au.miss.length>1?'s':''} short`,'warn'],no_record:['No ticket on record','bad']}[p.tk]}
  return `<div class="chip"><b>${esc(L)}</b><span class="pill ${e[1]}">${e[0]}</span>${t?`<span class="pill ${t[1]}">${t[0]}</span>`:''}</div>`}
function checks(a){const o=[];a.per.forEach(p=>{const L=REQ[p.id].label;const r=p.r;
  if(p.ev==='context')o.push(`<b>${esc(L)}:</b> logbook shows only keys / permits / being present. Ask directly whether they have done it hands-on.`);
  if(p.ev==='dated')o.push(`<b>${esc(L)}:</b> last hands-on entry was ${r.last}. Ask about recent practice.`);
  if((p.ev==='none'||p.ev==='routine')&&!(p.g&&HELD.includes(p.tk)))o.push(`<b>${esc(L)}:</b> no ${p.ev==='routine'?'skilled':'hands-on'} evidence in the logbooks.`);
  if(p.g&&HELD.includes(p.tk)&&p.ev!=='recent')o.push(`<b>${esc(L)}:</b> ticket is on record but the logbooks show no recent hands-on use. Ask about recent practice.`);
  if(p.tk==='no_record')o.push(`<b>${esc(L)}:</b> no ${REQ[p.id].sc} record found. Check for an Authority-internal authorisation before assuming it is absent.`);
  if(p.tk==='held_expiring')o.push(`<b>${esc(L)}:</b> ${r.au.sc} expires ${r.au.exp}.`);
  if(r&&r.cav.length&&['recent','dated'].includes(p.ev))o.push(`<b>${esc(L)}:</b> ${esc(r.cav.join('; '))}.`)});return o}
function employerView(){
  const musts=[...S.musts];
  const groups=[['Gated by a ticket',DATA.reqs.filter(r=>r.gate)],['Experience-based',DATA.reqs.filter(r=>!r.gate)]];
  let h=`<div class="grid"><aside class="opts"><h3>Role requirements</h3><p class="sub">Draft profiles – my guess at what these roles need, not the real postings.</p>
   <select style="width:100%" onchange="S.preset=this.value;S.musts=new Set(PRESETS[this.value]);render()">${Object.keys(PRESETS).map(p=>`<option ${p===S.preset?'selected':''}>${esc(p)}</option>`).join('')}</select>
   ${groups.map(([g,L])=>`<div class="g">${g}</div>${L.map(r=>`<label><input type="checkbox" ${S.musts.has(r.id)?'checked':''} onchange="toggle('${r.id}')"> ${esc(r.label)}</label>`).join('')}`).join('')}</aside><section>`;
  if(!musts.length)return h+'<p>Select at least one requirement.</p></section></div>';
  const all=DATA.keepers.map(k=>assess(k,musts));
  h+=`<p class="sub">Candidates are grouped, not scored. Within a group, those with fewer ticket gaps come first. Nothing here says anyone is authorised – it shows what the logs and records support.</p>`;
  BANDS.forEach(([t,d],i)=>{const L=all.filter(a=>a.band===i).sort((a,b)=>a.gaps-b.gaps||b.tot-a.tot);if(!L.length)return;
    h+=`<div class="band"><h2>${t} <span class="cnt">${L.length}</span></h2><p class="sub">${d}</p>`+L.map(a=>cand(a)).join('')+'</div>'});
  const hidden=all.filter(a=>a.band===4).length;h+=`<p class="sub" style="margin-top:20px">${hidden} keepers don’t reach “partial match” for this profile and aren’t listed.</p></section></div>`;return h}
function cand(a){const k=a.k;const open=S.open===k.id;
  let h=`<div class="card cand" onclick="S.open=${open?'null':`'${k.id}'`};render()"><div class="row"><h3>${esc(k.name)}</h3><span class="sub" style="margin:0">${esc(k.grade)}</span></div><div class="chips">${a.per.map(chip).join('')}</div>`;
  if(open){const c=checks(a);h+=`<div onclick="event.stopPropagation()">`;
   a.per.forEach(p=>{if(!p.r)return;h+=`<div style="margin-top:12px"><b>${esc(REQ[p.id].label)}</b><div class="sub" style="margin:0">${workLine(p.r)}</div>${p.g?`<div class="sub" style="margin:0">${authLine(p.r)}</div>`:''}<details><summary>Show the entries</summary>${exHtml(p.r,false)}</details></div>`});
   h+=c.length?`<div class="todo"><b>Check at interview</b><ul style="margin:6px 0 0;padding-left:18px">${c.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:'';h+='</div>'}
  return h+'</div>'}
function toggle(id){S.musts.has(id)?S.musts.delete(id):S.musts.add(id);render()}
/* ---------- EVIDENCE TAB ---------- */
function evidenceView(){
  const e=Object.entries(FB).filter(([k,v])=>v.v);const total=e.length;
  const by={};e.forEach(([k,v])=>{const t=v.kind+':'+v.tier;by[t]=by[t]||{yes:0,partly:0,no:0};by[t][v.v]++});
  const nm={'work:evidenced':'Work – “evidenced”','work:some_evidence':'Work – “some evidence”','work:routine_only':'Work – “routine only”','context:context_only':'Work – “around it, not doing it” (No = they did do the work)','route:one_module':'Route – “one module away”','route:two_modules':'Route – “two modules away”'};
  let h=`<h2 style="margin-top:0">Feedback so far</h2><p class="sub">Stored in this browser only. Export it and combine across reviewers. The number that decides the bet: of the claims marked “evidenced”, how many did the keeper say were wrong?</p>`;
  if(!total)return h+'<div class="card">No feedback yet. Use the Keeper view and answer the Yes / Partly / No questions.</div>';
  h+=`<table><tr><th>Claim type</th><th>Yes</th><th>Partly</th><th>No</th><th>Wrong rate</th></tr>`+Object.keys(nm).filter(k=>by[k]).map(k=>{const b=by[k],n=b.yes+b.partly+b.no;return `<tr><td>${nm[k]}</td><td>${b.yes}</td><td>${b.partly}</td><td>${b.no}</td><td>${Math.round(100*b.no/n)}% of ${n}</td></tr>`}).join('')+'</table>';
  h+=`<h2>Where it was wrong or partly wrong</h2>`+e.filter(([k,v])=>v.v!=='yes').map(([k,v])=>{const [kid,kind,req]=k.split('|');const kp=DATA.keepers.find(x=>x.id===kid);return `<div class="card"><b>${esc(kp?kp.name:kid)}</b> · ${esc(REQ[req]?REQ[req].label:SCHEME[req]||req)} · <span class="pill ${v.v==='no'?'bad':'warn'}">${v.v}</span> <span class="pill">${esc(v.tier)}</span><div class="sub" style="margin:4px 0 0">${esc(v.note||'(no note)')}</div></div>`}).join('')||'<p class="sub">None yet.</p>';
  h+=`<div class="row" style="margin-top:16px"><button class="btn" onclick="exportFB()">Download feedback (JSON)</button><button class="btn ghost" onclick="if(confirm('Clear all feedback from this browser?')){FB={};saveFB();render()}">Clear</button></div>`;return h}
function exportFB(){const b=new Blob([JSON.stringify(FB,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='carrowmore-feedback.json';a.click()}
/* ---------- shell ---------- */
function render(){
  $('#nav').innerHTML=[['keeper','Keeper view'],['employer','Employer view'],['evidence','Evidence']].map(([t,l])=>`<button class="${S.tab===t?'on':''}" onclick="S.tab='${t}';render()">${l}${t==='evidence'?` (${Object.values(FB).filter(v=>v.v).length})`:''}</button>`).join('');
  $('#main').innerHTML=`<div class="banner">Synthetic data (Carrowmore does not exist). Built from the clean subset: 38 current keepers. Appraisals, station-manager notes, dates of birth and failed-course records are deliberately not used.</div>`+(S.tab==='keeper'?keeperView():S.tab==='employer'?employerView():evidenceView())}
render();
</script></body></html>
